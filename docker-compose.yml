name: ${COMPOSE_PROJECT_NAME:-teslapark}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: teslapark-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - --host=127.0.0.1
        - --user=root
        - --password=${MYSQL_ROOT_PASSWORD}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - teslapark
    restart: unless-stopped

  # O emulador do GCS resolve o webhook em localhost:3003, ignorando EXTERNAL_API_URL.
  # Por isso a API compartilha este namespace de rede (network_mode: service) e as
  # portas de ambos os processos sao publicadas aqui.
  gate-control-system:
    image: ${GCS_IMAGE:?set GCS_IMAGE in .env}
    platform: ${GCS_PLATFORM:-linux/amd64}
    container_name: teslapark-gcs
    environment:
      EXTERNAL_API_URL: ${GCS_WEBHOOK_URL:-http://localhost:3003/webhook}
    ports:
      - "${GCS_HOST_PORT:-3000}:3000"
      - "${API_HOST_PORT:-3003}:3003"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "timeout 2 bash -c '< /dev/tcp/127.0.0.1/${GCS_PORT:-3000}'"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - teslapark
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: teslapark/api:${API_VERSION:-local}
    container_name: teslapark-api
    depends_on:
      mysql:
        condition: service_healthy
      gate-control-system:
        condition: service_healthy
    network_mode: service:gate-control-system
    environment:
      MICRONAUT_ENVIRONMENTS: ${MICRONAUT_ENVIRONMENTS:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Duser.timezone=UTC}
      DATASOURCE_URL: ${DATASOURCE_URL:?set DATASOURCE_URL in .env}
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:?set DATASOURCE_USERNAME in .env}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:?set DATASOURCE_PASSWORD in .env}
      GCS_BASE_URL: ${GCS_BASE_URL:-http://localhost:3000}
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:3003/health/readiness
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    container_name: teslapark-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - teslapark
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    container_name: teslapark-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - teslapark
    restart: unless-stopped

networks:
  teslapark:
    name: teslapark
    driver: bridge

volumes:
  mysql-data:
    name: teslapark-mysql-data
  prometheus-data:
    name: teslapark-prometheus-data
  grafana-data:
    name: teslapark-grafana-data
