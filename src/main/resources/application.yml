micronaut:
  application:
    name: teslapark-api
  server:
    port: 3003

datasources:
  default:
    url: ${DATASOURCE_URL:`jdbc:mysql://localhost:3306/teslapark?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true`}
    username: ${DATASOURCE_USERNAME:teslapark}
    password: ${DATASOURCE_PASSWORD:teslapark_local_only}
    driver-class-name: com.mysql.cj.jdbc.Driver
    dialect: MYSQL
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 3000
    validation-timeout: 3000

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: false
      clean-disabled: true

endpoints:
  all:
    enabled: false
    sensitive: true
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
